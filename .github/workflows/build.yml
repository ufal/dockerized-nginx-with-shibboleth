name: build

on:
  pull_request:
  push:
    branches:
      - 'main'

permissions:
  contents: read

jobs:
  docker:
    # Forks do not receive the credential needed for the private submodule.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Read pinned nginx revision
        id: nginx-ref
        run: |
          read -r mode type sha path < <(git ls-tree HEAD nginx/image)
          [[ "$mode" == "160000" && "$type" == "commit" && "$sha" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      # GITHUB_TOKEN cannot read another private repository. Use a read-only
      # fine-grained PAT or GitHub App token with access to the nginx repository.
      - name: Checkout private nginx submodule
        uses: actions/checkout@v4
        with:
          repository: dataquest-dev/docker-nginx-shib-auth
          ref: ${{ steps.nginx-ref.outputs.sha }}
          path: nginx/image
          token: ${{ secrets.NGINX_SUBMODULE_TOKEN }}
          persist-credentials: false
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      -
        name: Build nginx
        uses: docker/build-push-action@v5
        with:
          context: ./nginx/image
          file: ./nginx/image/Dockerfile.shib
          target: nginx-configured
          build-contexts: |
            nginx-config=./nginx/conf
          load: true
          tags: |
            ghcr.io/ufal/dockerized-nginx-with-shibboleth/nginx-shib:latest
            local/nginx-shib-review:latest
          cache-from: type=gha,scope=nginx
          cache-to: type=gha,scope=nginx,mode=max
      -
        name: Build shibboleth
        uses: docker/build-push-action@v5
        with:
            context: ./shibboleth
            load: true
            tags: |
              ghcr.io/ufal/dockerized-nginx-with-shibboleth/shibboleth:latest
              local/shibboleth-review:latest
            cache-from: type=gha,scope=shibboleth
            cache-to: type=gha,scope=shibboleth,mode=max
      - name: Verify nginx and Shibboleth integration
        run: |
          docker pull python:3.11-slim
          docker pull cr.fluentbit.io/fluent/fluent-bit:latest
          python -m pip install -r tests/requirements.txt
          python tests/integration.py
          python tests/integration.py --image-only
      - name: Save verified images
        if: github.event_name == 'push'
        run: |
          docker save -o verified-images.tar ghcr.io/ufal/dockerized-nginx-with-shibboleth/nginx-shib:latest ghcr.io/ufal/dockerized-nginx-with-shibboleth/shibboleth:latest
      - name: Upload verified images
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: verified-images
          path: verified-images.tar
          compression-level: 0
          retention-days: 1

  publish:
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download verified images
        uses: actions/download-artifact@v4
        with:
          name: verified-images
      - name: Load verified images
        run: docker load -i verified-images.tar
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish verified images
        run: |
          docker push ghcr.io/ufal/dockerized-nginx-with-shibboleth/nginx-shib:latest
          docker push ghcr.io/ufal/dockerized-nginx-with-shibboleth/shibboleth:latest
