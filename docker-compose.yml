services:
  nginx:
    image: local/dspace-nginx-shib:1.30.5
    platform: linux/amd64
    restart: unless-stopped
    build:
      context: ./nginx/conf
      # Download the pinned upstream release; this project only packages it.
      dockerfile_inline: |
        FROM ubuntu:22.04 AS nginx-release
        RUN apt-get update && apt-get install -y --no-install-recommends ca-certificates curl
        ARG NGINX_RELEASE_ASSET_ID=640181284
        ARG NGINX_RELEASE_SHA256=ce86499c6587fe5048f0fe5b85f69c009d2d941da3a2b47044ca12d2841dddc4
        RUN --mount=type=secret,id=github_token,required=true \
            curl -fsSL --retry 3 \
              -H "Authorization: Bearer $$(cat /run/secrets/github_token)" \
              -H "Accept: application/octet-stream" \
              -o /tmp/nginx.tar.gz \
              "https://api.github.com/repos/dataquest-dev/docker-nginx-shib-auth/releases/assets/$$NGINX_RELEASE_ASSET_ID" \
         && printf '%s  %s\n' "$$NGINX_RELEASE_SHA256" /tmp/nginx.tar.gz | sha256sum -c - \
         && mkdir /out && tar -xzf /tmp/nginx.tar.gz -C /out \
         && test -x /out/usr/sbin/nginx && test ! -e /out/usr/sbin/shibd
        FROM nginx:1.30.5
        RUN rm /usr/sbin/nginx-debug
        COPY --from=nginx-release --chown=0:0 /out/usr/sbin/nginx /usr/sbin/nginx
        COPY --from=nginx-release --chown=0:0 /out/etc/nginx/ /etc/nginx/
        COPY --from=nginx-release --chown=0:0 /out/licenses/ /usr/share/doc/nginx-shib/licenses/
        COPY . /etc/nginx/
      secrets:
        - github_token
    # Always package the pinned release, rather than pulling a stale registry image.
    pull_policy: build
    ports:
      - 80:80
      - 443:443
    volumes:
      - ./nginx/conf/proxy_params:/etc/nginx/proxy_params:ro
      - ./nginx/conf/shibboleth_auth:/etc/nginx/shibboleth_auth:ro
      - ./nginx/conf/ssl_params:/etc/nginx/ssl_params:ro
      - ./nginx/conf/cors_headers:/etc/nginx/cors_headers:ro
      - ./nginx/conf/templates:/etc/nginx/templates:ro
    # generate /ssl/dhparam.pem with openssl dhparam -out dhparam.pem 4096
      - ./nginx/locations:/etc/nginx/locations
      - ./nginx/ssl:/ssl
    environment:
      - NGINX_ENVSUBST_FILTER=^NGINX_
      - NGINX_SHIBAUTHORIZER=${NGINX_SHIBAUTHORIZER:-shibboleth:12344}
      - NGINX_SHIBRESPONDER=${NGINX_SHIBRESPONDER:-shibboleth:12345}
      - NGINX_TOMCAT
      - NGINX_NODE
      - NGINX_SERVER_NAMES
      - NGINX_RESOLVERS
      # this configures client_max_body_size only for the repository /server location
      - NGINX_MAX_BODY_SIZE=${NGINX_MAX_BODY_SIZE:-10G}
    depends_on:
      - shibboleth
      - syslog

  shibboleth:
    image: local/dspace-shibboleth:3.6.0
    restart: unless-stopped
    platform: linux/amd64
    build:
      # Installs the pinned upstream SP release (asset ID/SHA-256 in shibboleth/Dockerfile).
      context: ./shibboleth
      secrets:
        - github_token
    pull_policy: build
    volumes:
    # config (+key material), logs
    - ./shibboleth/overrides:/overrides
    - ./shibboleth/sp-keys:/sp-keys
    - logs:/opt/shibboleth-sp/var/log
    environment:
     - SHIB_HOSTNAME=${SHIB_HOSTNAME:?SHIB_HOSTNAME must be set}

  syslog:
    image: cr.fluentbit.io/fluent/fluent-bit@sha256:c5542543523c9678398dd78d927c05e8425ec15b038f226b67b3b019b1a70845
    restart: unless-stopped
    volumes:
      - ./fluent-bit/config.conf:/fluent-bit/etc/fluent-bit.conf
      - logs:/logs
    ports:
      - "5140:5140/udp"

volumes:
  logs:

secrets:
  github_token:
    environment: GH_TOKEN
