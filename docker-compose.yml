services:
  nginx:
    image: local/dspace-nginx-shib:1.31.6
    restart: unless-stopped
    build:
      context: ./nginx/conf
      # Runtime packaging belongs here; compilation belongs to the submodule.
      dockerfile_inline: |
        FROM nginx:1.31.6 AS compiler
        RUN apt-get update && apt-get install -y --no-install-recommends \
            build-essential ca-certificates curl libpcre2-dev libssl-dev zlib1g-dev
        WORKDIR /src
        COPY --from=nginx-source /versions.env ./
        COPY --from=nginx-source /scripts/build.sh scripts/build.sh
        RUN sh scripts/build.sh /out
        FROM nginx:1.31.6
        RUN rm /usr/sbin/nginx-debug
        COPY --from=compiler /out/usr/sbin/nginx /usr/sbin/nginx
        COPY --from=compiler /out/etc/nginx/ /etc/nginx/
        COPY --from=compiler /out/licenses/ /usr/share/doc/nginx-shib/licenses/
        COPY . /etc/nginx/
      additional_contexts:
        nginx-source: ./nginx/image
    # Always use the pinned source build, rather than a stale registry image.
    pull_policy: build
    ports:
      - 80:80
      - 443:443
    volumes:
      - ./nginx/conf/proxy_params:/etc/nginx/proxy_params:ro
      - ./nginx/conf/shibboleth_auth:/etc/nginx/shibboleth_auth:ro
      - ./nginx/conf/ssl_params:/etc/nginx/ssl_params:ro
      - ./nginx/conf/cors_headers:/etc/nginx/cors_headers:ro
      - ./nginx/conf/templates:/etc/nginx/templates:ro
    # generate /ssl/dhparam.pem with openssl dhparam -out dhparam.pem 4096
      - ./nginx/locations:/etc/nginx/locations
      - ./nginx/ssl:/ssl
    environment:
      - NGINX_ENVSUBST_FILTER=^NGINX_
      - NGINX_SHIBAUTHORIZER=${NGINX_SHIBAUTHORIZER:-shibboleth:12344}
      - NGINX_SHIBRESPONDER=${NGINX_SHIBRESPONDER:-shibboleth:12345}
      - NGINX_TOMCAT
      - NGINX_NODE
      - NGINX_SERVER_NAMES
      - NGINX_RESOLVERS
      # this configures client_max_body_size only for the repository /server location
      - NGINX_MAX_BODY_SIZE=${NGINX_MAX_BODY_SIZE:-10G}
    depends_on:
      - shibboleth
      - syslog

  shibboleth:
    image: local/dspace-shibboleth:3.6.0
    restart: unless-stopped
    build: ./shibboleth
    pull_policy: build
    volumes:
    # config (+key material), logs
    - ./shibboleth/overrides:/overrides
    - ./shibboleth/sp-keys:/sp-keys
    - logs:/opt/shibboleth-sp/var/log
    environment:
     - SHIB_HOSTNAME=${SHIB_HOSTNAME:?SHIB_HOSTNAME must be set}

  syslog:
    image: cr.fluentbit.io/fluent/fluent-bit@sha256:c5542543523c9678398dd78d927c05e8425ec15b038f226b67b3b019b1a70845
    restart: unless-stopped
    volumes:
      - ./fluent-bit/config.conf:/fluent-bit/etc/fluent-bit.conf
      - logs:/logs
    ports:
      - "5140:5140/udp"

volumes:
  logs:
